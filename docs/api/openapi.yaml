# 本檔由 backend/scripts/export_openapi.py 產生，是前後端唯一的 API 契約。請勿手改；變更須經人核可。
openapi: 3.1.0
info:
  title: Shop API
  description: 購物網站 API 契約（前後端唯一介面）。金額單位：新台幣元（整數）。
  version: 1.0.0
paths:
  /api/v1/auth/csrf:
    get:
      tags:
      - auth
      summary: 取得 CSRF token（網站開啟時先呼叫一次）
      operationId: get_csrf_api_v1_auth_csrf_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfOut'
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: 註冊並登入
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
