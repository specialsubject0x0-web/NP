        shipping_fee:
          type: integer
          title: Shipping Fee
        total:
          type: integer
          title: Total
        currency:
          type: string
          title: Currency
        coupon_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Coupon Code
      type: object
      required:
      - items
      - subtotal
      - discount
      - shipping_fee
      - total
      - currency
      - coupon_code
      title: QuoteOut
      description: 後端計算的金額（真相來源）。total = subtotal - discount + shipping_fee。
    RegisterIn:
      properties:
        email:
          type: string
          maxLength: 254
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Email
        password:
          type: string
          maxLength: 128
          minLength: 8
          title: Password
        name:
          type: string
          maxLength: 50
          minLength: 1
          title: Name
      additionalProperties: false
      type: object
      required:
      - email
      - password
      - name
      title: RegisterIn
      description: 註冊：Email、密碼（至少 8 字，R-16）、顯示名稱。
    TransitionIn:
      properties:
        to_status:
          type: string
          enum:
          - shipped
          - completed
          - cancelled
          title: To Status
      additionalProperties: false
      type: object
      required:
      - to_status
      title: TransitionIn
      description: 後台改訂單狀態。paid 只能由付款回呼產生，所以這裡不能選。
    UserOut:
      properties:
        id:
          type: integer
          title: Id
        email:
          type: string
          title: Email
        name:
          type: string
          title: Name
        role:
          type: string
          enum:
          - member
          - admin
          title: Role
      type: object
      required:
      - id
      - email
      - name
      - role
      title: UserOut
      description: 目前登入者的公開資料。
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
